name: Build Windows executable

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Gerenciador-de-Etiquetas --collect-all reportlab main.py

      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Versao ${{ github.run_number }}
          body: "Build do commit ${{ github.sha }}. Baixe Gerenciador-de-Etiquetas.exe."
          make_latest: true
          files: dist/Gerenciador-de-Etiquetas.exe
